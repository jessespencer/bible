<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Memorize Scripture, up to whole books, one verse at a time." />
    <meta name="theme-color" content="#f5f0e6" />
    <title>By Heart</title>
    <!-- Day or Night before first paint. The choice is bible-ui's `bui-theme`, shared with
         Atlas and Lineage; until one is made, By Heart follows the system. -->
    <script>
      try {
        // By Heart's own setting from before the apps shared one.
        var legacy = localStorage.getItem('byheart.theme')
        if (legacy && !localStorage.getItem('bui-theme')) localStorage.setItem('bui-theme', legacy)
        localStorage.removeItem('byheart.theme')
        var saved = localStorage.getItem('bui-theme')
      } catch (e) {}
      if (saved ? saved === 'light' : !matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = 'light'
      else document.querySelector('meta[name="theme-color"]').content = '#020611'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
